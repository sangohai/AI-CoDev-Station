system_architecture:
  paradigm: "Pure ES Modules (Native Browser Support)"
  entry_point: "main.js (Dispatcher)"

  modules:
    config: "Global state (config, state) and localStorage persistence."
    github-api: "GitHub REST/Git Data API engine. Handles CRUD, Repo creation, Fork, and Delete."
    ui_manager: "Tree-based sidebar rendering and path-state synchronization."
    editor_engine: "Syntax-aware preview (MD/JSON/YAML/HTML) and image compression."
    utils: "Unicode-safe Base64 encoding, sleep timers, and UI status feedback."
    emoji: "Persistent local custom emoji storage and picker logic."

  logic_flow:
    incubation: "createRepo -> sleep(4s) -> sequential template injection (.ai-skill/*) -> reload"
    sync: "Cache-busting (?t=now) + consistency sleep (800ms-1000ms)"
    security: "Double-confirmation for deletion + safeBind event pattern to prevent JS crashes"

  coding_standard: "JSDoc-enforced type hinting for all exported functions."
